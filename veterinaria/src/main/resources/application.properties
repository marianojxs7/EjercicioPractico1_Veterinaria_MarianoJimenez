spring.application.name=veterinaria

# Conexion a MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_citas
spring.datasource.username=usuario_caso_practico_01_var
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto solicitado en el caso practico
server.port=8086

# Mensajes y registro de errores
logging.level.root=INFO
logging.level.com.veterinaria=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{dd HH:mm} %-5level %logger{36} - %msg%n
