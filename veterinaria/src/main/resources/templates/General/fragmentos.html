
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{app.nombre}">Huella Verde Veterinaria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/veterinaria.css}">
</head>

<body>

    <!-- Encabezado y navegación -->
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    <span>🐾</span>
                    <span th:text="#{app.nombre}">Huella Verde</span>
                </a>

                <button class="navbar-toggler bg-light" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal"
                        aria-controls="menuPrincipal"
                        aria-expanded="false"
                        aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}"
                               th:text="#{nav.inicio}">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/tipo-servicio/listado}"
                               th:text="#{nav.tipos}">Tipos de servicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/servicio/listado}"
                               th:text="#{nav.servicios}">Servicios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/cita/listado}"
                               th:text="#{nav.citas}">Citas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/#contacto}"
                               th:text="#{nav.contacto}">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Pie de página -->
    <footer th:fragment="footer">
        <div class="container">
            <p class="mb-1" th:text="#{footer.mensaje}">
                Cuidamos a quienes llenan tu vida de alegría.
            </p>
            <p class="mb-0">
                &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span>
                <span th:text="#{app.nombre}">Huella Verde Veterinaria</span>.
                <span th:text="#{footer.derechos}">Todos los derechos reservados.</span>
            </p>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </footer>

</body>
</html>
